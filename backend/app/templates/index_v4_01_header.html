<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数治骑迹 控制台</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f8ff;
            color: #1f2a44;
            overflow-x: hidden;
        }
        header {
            background: linear-gradient(120deg, #165DFF, #3E8BFF);
            color: #fff;
            padding: 24px 32px;
            box-shadow: 0 4px 12px rgba(22,93,255,0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        header h1 { 
            margin: 0 0 8px; 
            font-size: 28px; 
            font-weight: 600;
        }
        header p { 
            margin: 0; 
            opacity: 0.95; 
            font-size: 14px;
        }
        .header-actions {
            margin-top: 12px;
            display: flex;
            gap: 12px;
        }
        .header-actions button {
            padding: 6px 16px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .header-actions button:hover {
            background: rgba(255,255,255,0.2);
        }
        main {
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }
        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        section {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(22,93,255,0.08);
            padding: 24px;
            transition: box-shadow 0.3s;
        }
        section:hover {
            box-shadow: 0 8px 24px rgba(22,93,255,0.12);
        }
        h2 {
            margin: 0 0 16px;
            font-size: 18px;
            color: #0E1E5B;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            background: #f5f8ff;
            font-size: 13px;
            white-space: pre-wrap;
        }
        .status.ok { border-left: 4px solid #28a745; }
        .status.err { border-left: 4px solid #d93025; color: #b11c1c; }
        button {
            background: #165DFF;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            font-weight: 500;
        }
        button:hover { 
            background: #0d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(22,93,255,0.3);
        }
        button.secondary { 
            background: #fff; 
            color: #165DFF; 
            border: 1px solid #165DFF; 
        }
        button.secondary:hover {
            background: #f5f8ff;
        }
        input, select, textarea {
            font: inherit;
            border: 1px solid #cfd8ff;
            border-radius: 8px;
            padding: 10px 14px;
            width: 100%;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #165DFF;
            box-shadow: 0 0 0 3px rgba(22,93,255,0.1);
        }
    </style>
</head>
<body>
    <header>
        <h1>🚔 数治骑迹</h1>
        <p>科技驱动 · 数据赋能 · 协同共治 | 一站式风险识别与预警决策系统</p>
        <div class="header-actions">
            <button onclick="loadSummary()">📊 刷新数据</button>
            <button onclick="exportLogs()" class="secondary">📥 导出日志</button>
            <button onclick="toggleTheme()" class="secondary">🌓 切换主题</button>
        </div>
    </header>
    <main id="mainContent">
        <!-- 内容将通过JavaScript动态加载 -->
    </main>
